name: Image

# Publishes ghcr.io/armistice-group/ac-modern for linux/amd64 and linux/arm64.
#   push to main  -> :latest, :main, :<major>.<minor>.<run number> (minor from package.json)
#   tag v1.2.3    -> :1.2.3, :1.2, :1, :latest
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight build, so an older image can't land on :latest last.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    # Docker builds go to the x64 self-hosted runners (as in pwnbook); arm64 is built through QEMU.
    runs-on: [self-hosted, x64]
    timeout-minutes: 45
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every main build gets its own version: package.json's major.minor plus the run number.
      # A v* tag uses the tag's version instead.
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # major.minor from package.json, without needing Node on the runner.
            base=$(sed -nE 's/^[[:space:]]*"version": "([0-9]+\.[0-9]+)\..*/\1/p' package.json | head -1)
            echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ac-modern
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.description=A modern, self-hosted Postgres console for the homelab
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ACM_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
