name: CI

# Pushes and pull requests from branches in this repo run on the Armistice self-hosted
# runners (same labels as pwnbook):
#   self-hosted         checks, tests, build
#   [self-hosted, x64]  anything that runs Docker containers (the Postgres service)
# Pull requests from forks run on GitHub-hosted runners instead: the repo is public, and
# code from a fork must never run on our machines.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run (never on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  check:
    name: Type-check, test (SQLite) and build
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    steps:
      # Docker jobs on the shared runner can leave root-owned files behind.
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The pnpm that package.json pins, installed into this job's temp dir: nothing global
      # on the shared runner (pnpm/action-setup's self-installer trips over leftovers there).
      - name: Install pnpm
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/pnpm" "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  test-postgres:
    name: Test (Postgres)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "x64"]') }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: acm_test
        # A random host port, so parallel jobs on one runner don't collide.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The pnpm that package.json pins, installed into this job's temp dir: nothing global
      # on the shared runner (pnpm/action-setup's self-installer trips over leftovers there).
      - name: Install pnpm
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/pnpm" "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          echo "$RUNNER_TEMP/pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      # The service's host port is only known at runtime, so the URL is set here.
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@localhost:${{ job.services.postgres.ports['5432'] }}/acm_test
